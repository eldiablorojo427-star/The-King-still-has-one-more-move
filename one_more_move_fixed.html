</div><div class="coords"><span>a</span><span>b</span><span>c</span><span>d</span><span>e</span><span>f</span><span>g</span><span>h</span></div><button id="go" type="button">♜ TOUCH HERE — ONE MORE MOVE</button><br><button id="reset" type="button">↺ RESET</button><div id="status" class="status" aria-live="polite">One move changes everything.</div><p class="note">Locked demonstration position · White to move · Ra8#</p></main><script>(function(){const b=document.getElementById('board'),a=b.querySelector('[data-square="a1"]'),z=b.querySelector('[data-square="a8"]'),status=document.getElementById('status');let busy=false;document.getElementById('go').addEventListener('click',function(){if(busy)return;busy=true;a.classList.add('mark');z.classList.add('mark');status.textContent='The rook rises from a1 to a8…';setTimeout(function(){a.innerHTML='<span></span>';z.innerHTML='<span class="white-piece">♖</span>';status.innerHTML='<strong>Ra8# — CHECKMATE. WHITE WINS.</strong><br>The black king has no legal escape.';busy=false},650)});document.getElementById('reset').addEventListener('click',function(){busy=false;a.innerHTML='<span class="white-piece">♖</span>';z.innerHTML='<span></span>';a.classList.remove('mark');z.classList.remove('mark');status.textContent='One move changes everything.'})})();</script></body></html>
